name: MongoDB Keep-Alive

# Pings the Atlas cluster on a schedule so it never hits the 30-day
# inactivity auto-pause (confirmed live 2026-09-18 — Atlas's real
# threshold, not the 60 days originally assumed here). A bare ping alone
# wasn't enough to prevent it either: this workflow ran successfully every
# week, but Atlas still reported the cluster inactive. scripts/keep-alive.js
# now also does a real findOne() against the actual collection, which is
# what should genuinely reset the inactivity clock.
on:
  schedule:
    # Every Monday at 12:00 UTC (weekly is comfortably within the 30-day window)
    - cron: '0 12 * * 1'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install mongodb driver
        run: npm install mongodb dotenv --no-save

      - name: Ping MongoDB
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
          MONGODB_COLLECTION: ${{ secrets.MONGODB_COLLECTION }}
        run: node scripts/keep-alive.js
